<script>
(function(){
var t=document.getElementById('t'),a=document.getElementById('a');
var msgs=['A wild Christmas appeared!','Merry Christmas, my beautiful wife!'];
var still=false;try{still=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
if(still)return;
var run=0;
function type(s,done){var i=0;t.textContent='';a.classList.remove('on');
(function step(){if(i<=s.length){t.textContent=s.slice(0,i++);setTimeout(step,55)}else{done&&done()}})()}
function play(){var id=++run;
type(msgs[0],function(){if(id!==run)return;a.classList.add('on');
setTimeout(function(){if(id!==run)return;type(msgs[1],function(){if(id===run)a.classList.add('on')})},1500)})}
play();
document.querySelector('.box').addEventListener('click',play);
})();
</script>
