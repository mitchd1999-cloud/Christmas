<style>
:root {
  --bg1: #1a0d10;
  --bg2: #4a1224;
  --box: #1c1c2e;
  --ink: #f5f0e0;
  --star: #ffe9a8;
  --o: #0a0508;
  /* Reduced scale on mobile so the ring fits higher above the bottom row */
  --rw: min(100vw, 85vh);
  --rh: calc(var(--rw) * 0.8863);
  color-scheme: dark;
}

html, body {
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: linear-gradient(180deg, var(--bg1), var(--bg2));
  font-family: 'Press Start 2P', 'Courier New', monospace;
}

.stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.stars i {
  position: absolute;
  width: 4px;
  height: 4px;
  background: var(--star);
  opacity: .8;
  animation: tw 2.4s steps(2) infinite;
}

@keyframes tw {
  50% { opacity: .15; }
}

/* Adjust ring position slightly higher on narrow screens to make room for Vaporeon/Eevee/Flareon */
.ring {
  position: absolute;
  left: 50%;
  top: 40%;
  width: var(--rw);
  height: var(--rh);
  transform: translate(-50%, -40%);
  pointer-events: none;
}
